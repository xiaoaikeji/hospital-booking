zh-CN:
  date:
    formats:
      default: "%Y-%m-%d"
      short: "%m-%d"
      long: "%Y年%m月%d日"
    day_names: [星期日, 星期一, 星期二, 星期三, 星期四, 星期五, 星期六]
    abbr_day_names: [日, 一, 二, 三, 四, 五, 六]
    month_names: [~, 一月, 二月, 三月, 四月, 五月, 六月, 七月, 八月, 九月, 十月, 十一月, 十二月]
    abbr_month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    order: [year, month, day]
  time:
    formats:
      default: "%Y-%m-%d %H:%M:%S"
      short: "%m-%d %H:%M"
      long: "%Y年%m月%d日 %H:%M"
      minute: "%Y-%m-%d %H:%M"
    am: 上午
    pm: 下午
  support:
    array:
      words_connector: "、"
      two_words_connector: "和"
      last_word_connector: "和"
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: "不能为空"
      required: "不能为空"
      taken: "已经被使用"
      confirmation: "与%{attribute}不一致"
      inclusion: "不在可选范围内"
      exclusion: "不可使用"
      invalid: "格式不正确"
      accepted: "必须接受"
      empty: "不能为空"
      present: "必须为空"
      too_long: "最多 %{count} 个字符"
      too_short: "至少 %{count} 个字符"
      wrong_length: "必须为 %{count} 个字符"
      not_a_number: "必须是数字"
      not_an_integer: "必须是整数"
      greater_than: "必须大于 %{count}"
      greater_than_or_equal_to: "不能小于 %{count}"
      equal_to: "必须等于 %{count}"
      less_than: "必须小于 %{count}"
      less_than_or_equal_to: "不能大于 %{count}"
      other_than: "不能等于 %{count}"
      odd: "必须为奇数"
      even: "必须为偶数"
